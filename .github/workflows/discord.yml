name: Discord Notify

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Build & Release"
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Unit tests
        run: npx tsx --test "src/**/*.test.ts"

      - name: Build
        run: bun run build

  notify-commit:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Send commit notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret"
            exit 1
          fi

          if [ "$(jq '.commits | length' "$GITHUB_EVENT_PATH")" -eq 0 ]; then
            echo "No commits in this push, skipping"
            exit 0
          fi

          jq '
            def trunc($n): if length > $n then .[0:$n - 1] + "…" else . end;
            def esc: gsub("(?<c>[\\\\`*_~|\\[\\]<>])"; "\\" + .c);
            (.commits | length) as $count
            | (.ref | sub("^refs/heads/"; "")) as $branch
            | {
                username: "Crawnline Chess",
                allowed_mentions: {parse: []},
                embeds: [{
                  author: {name: .sender.login, icon_url: .sender.avatar_url, url: .sender.html_url},
                  title: ("[\(.repository.name):\($branch)] \($count) new commit\(if $count == 1 then "" else "s" end)" | trunc(256)),
                  url: (if $count == 1 then .head_commit.url else .compare end),
                  description: ((.commits[0:10] | map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | trunc(72) | esc) - \(.author.name | esc)") | join("\n")) + (if $count > 10 then "\n…and \($count - 10) more" else "" end)),
                  color: 5793266,
                  fields: [
                    {name: "Releases", value: "[Open releases page](\(.repository.html_url)/releases)", inline: false}
                  ],
                  timestamp: .head_commit.timestamp,
                  footer: {text: .repository.full_name}
                }]
              }
          ' "$GITHUB_EVENT_PATH" > payload.json

          curl -fsS --retry 3 \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"

  notify-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send release notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret"
            exit 1
          fi

          if ! gh release view "$TAG" \
            --json tagName,name,url,body,isDraft,isPrerelease,publishedAt,targetCommitish \
            > release.json 2> /dev/null; then
            echo "No release found for '$TAG', skipping"
            exit 0
          fi

          if [ "$(jq -r '.isDraft' release.json)" = "true" ]; then
            echo "Release is a draft, skipping"
            exit 0
          fi

          jq --arg repo "$GH_REPO" --arg releases "$GITHUB_SERVER_URL/$GH_REPO/releases" '
            def trunc($n): if length > $n then .[0:$n - 1] + "…" else . end;
            ((.name | select(. != null and . != "")) // .tagName) as $title
            | . as $r
            | {
                username: "Crawnline Chess",
                allowed_mentions: {parse: []},
                embeds: [{
                  title: ("\(if $r.isPrerelease then "New pre-release" else "New release" end): \($title)" | trunc(256)),
                  url: $r.url,
                  description: (($r.body // "") | if . == "" then "No release notes provided." else trunc(3500) end),
                  color: (if $r.isPrerelease then 16705372 else 5763719 end),
                  fields: [
                    {name: "Tag", value: ("`" + $r.tagName + "`"), inline: true},
                    {name: "Target", value: ("`" + $r.targetCommitish + "`"), inline: true},
                    {name: "Releases", value: "[View this release](\($r.url)) • [All releases](\($releases))", inline: false}
                  ],
                  timestamp: $r.publishedAt,
                  footer: {text: $repo}
                }]
              }
          ' release.json > payload.json

          curl -fsS --retry 3 \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"
