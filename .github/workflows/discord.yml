name: Discord Notifications

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

jobs:
  notify-commit:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Send commit notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret"
            exit 1
          fi

          if [ "$(jq '.commits | length' "$GITHUB_EVENT_PATH")" -eq 0 ]; then
            echo "No commits in this push, skipping"
            exit 0
          fi

          jq '
            def trunc($n): if length > $n then .[0:$n - 1] + "…" else . end;
            def esc: gsub("(?<c>[\\\\`*_~|\\[\\]<>])"; "\\" + .c);
            (.commits | length) as $count
            | (.ref | sub("^refs/heads/"; "")) as $branch
            | {
                username: "Crawnline Chess",
                allowed_mentions: {parse: []},
                embeds: [{
                  author: {name: .sender.login, icon_url: .sender.avatar_url, url: .sender.html_url},
                  title: ("[\(.repository.name):\($branch)] \($count) new commit\(if $count == 1 then "" else "s" end)" | trunc(256)),
                  url: (if $count == 1 then .head_commit.url else .compare end),
                  description: ((.commits[0:10] | map("[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0] | trunc(72) | esc) - \(.author.name | esc)") | join("\n")) + (if $count > 10 then "\n…and \($count - 10) more" else "" end)),
                  color: 5793266,
                  timestamp: .head_commit.timestamp,
                  footer: {text: .repository.full_name}
                }]
              }
          ' "$GITHUB_EVENT_PATH" > payload.json

          curl -fsS --retry 3 \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"

  notify-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Send release notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret"
            exit 1
          fi

          jq '
            def trunc($n): if length > $n then .[0:$n - 1] + "…" else . end;
            .release as $r
            | (($r.name | select(. != null and . != "")) // $r.tag_name) as $title
            | {
                username: "Crawnline Chess",
                allowed_mentions: {parse: []},
                embeds: [{
                  author: {name: $r.author.login, icon_url: $r.author.avatar_url, url: $r.author.html_url},
                  title: ("\(if $r.prerelease then "New pre-release" else "New release" end): \($title)" | trunc(256)),
                  url: $r.html_url,
                  description: (($r.body // "") | if . == "" then "No release notes provided." else trunc(3500) end),
                  color: (if $r.prerelease then 16705372 else 5763719 end),
                  fields: [
                    {name: "Tag", value: ("`" + $r.tag_name + "`"), inline: true},
                    {name: "Target", value: ("`" + $r.target_commitish + "`"), inline: true}
                  ],
                  timestamp: $r.published_at,
                  footer: {text: .repository.full_name}
                }]
              }
          ' "$GITHUB_EVENT_PATH" > payload.json

          curl -fsS --retry 3 \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"