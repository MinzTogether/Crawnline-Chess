name: Discord Notify

# Đặt file này tại: .github/workflows/discord-notify.yml (nhánh main)
# Cần tạo secret: Settings → Secrets and variables → Actions → DISCORD_WEBHOOK_URL

on:
  # 1) Commit mới đẩy lên nhánh main
  push:
    branches: [main]

  # 2) Release mới: chạy sau khi workflow build/release của bạn hoàn tất.
  #    Lý do không dùng `on: release`: release tạo bằng GITHUB_TOKEN
  #    sẽ KHÔNG kích hoạt workflow khác.
  workflow_run:
    workflows: ["CI Build & Release"] # ⚠️ ĐỔI thành `name:` của workflow build/release hiện có
    types: [completed]

permissions:
  contents: read

jobs:
  commit:
    name: Thông báo commit mới
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Gửi embed commit tới Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "::error::Thiếu secret DISCORD_WEBHOOK_URL"; exit 1; }

          count=$(jq '(.commits // []) | length' "$GITHUB_EVENT_PATH")
          if [ "$count" -eq 0 ]; then
            echo "Không có commit mới, bỏ qua."
            exit 0
          fi

          payload=$(jq -c --arg repo "$REPO" --arg branch "$BRANCH" '
            def short($n): if length > $n then .[:$n] + "…" else . end;
            . as $ev
            | ($ev.commits // []) as $commits
            | {
                username: "Crawnline Chess",
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: "📝 \($commits | length) commit mới trên \($branch)",
                  url: $ev.compare,
                  color: 5793266,
                  author: {
                    name: $ev.sender.login,
                    icon_url: $ev.sender.avatar_url,
                    url: $ev.sender.html_url
                  },
                  description: (
                    ($commits[:10] | map("[`\(.id[:7])`](\(.url)) \(.message | split("\n")[0] | short(80)) — \(.author.name)") | join("\n"))
                    + (if ($commits | length) > 10 then "\n…và \(($commits | length) - 10) commit khác" else "" end)
                  ),
                  footer: { text: $repo },
                  timestamp: (now | todate)
                }]
              }' "$GITHUB_EVENT_PATH")

          curl -sS --fail-with-body -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"

  release:
    name: Thông báo release mới
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Gửi embed release tới Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          # Với run kích hoạt bởi tag, head_branch chính là tên tag
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "::error::Thiếu secret DISCORD_WEBHOOK_URL"; exit 1; }

          case "$TAG" in
            v*|Android-v*|Windows-v*) ;;
            *) echo "'$TAG' không phải tag release, bỏ qua."; exit 0 ;;
          esac

          if ! release=$(gh release view "$TAG" --repo "$REPO" \
              --json tagName,name,url,body,isDraft,isPrerelease,publishedAt,assets 2>/dev/null); then
            echo "Chưa có release cho tag $TAG, bỏ qua."
            exit 0
          fi

          if [ "$(jq -r '.isDraft' <<<"$release")" = "true" ]; then
            echo "Release đang là draft, bỏ qua."
            exit 0
          fi

          payload=$(jq -nc --argjson r "$release" --arg repo "$REPO" '
            def short($n): if length > $n then .[:$n] + "…" else . end;
            ($r.assets | map("[\(.name)](\(.url))") | join("\n")) as $files
            | {
                username: "Crawnline Chess",
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: "🚀 Release mới: \($r.name // $r.tagName)",
                  url: $r.url,
                  color: (if $r.isPrerelease then 16753920 else 5763719 end),
                  description: (
                    ($r.body // "" | short(1500))
                    | if . == "" then "_Không có ghi chú phát hành._" else . end
                  ),
                  fields: [
                    { name: "Tag", value: "`\($r.tagName)`", inline: true },
                    { name: "Loại", value: (if $r.isPrerelease then "Pre-release" else "Stable" end), inline: true },
                    { name: "Tải về", value: (if $files == "" then "—" else ($files | short(1000)) end) }
                  ],
                  footer: { text: $repo },
                  timestamp: ($r.publishedAt // (now | todate))
                }]
              }')

          curl -sS --fail-with-body -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
