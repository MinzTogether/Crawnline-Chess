name: Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'Android-v*'
      - 'Windows-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: Crownline Chess
  APP_SLUG: Crownline-Chess
  APP_ID: com.minztogether.crownlinechess
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  CAPACITOR_VERSION: '^8'
  ELECTRON_VERSION: '^45'
  ELECTRON_BUILDER_VERSION: '^26'

jobs:
  prepare-app:
    name: Prepare app assets & checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION=$(echo "$TAG" | sed -E 's/^(Android-|Windows-)?v//')
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag '$TAG' không hợp lệ. Dùng v1.2.3, Android-v1.2.3 hoặc Windows-v1.2.3"
              exit 1
            fi
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Unit tests
        run: npx tsx --test "src/**/*.test.ts"

      # Build the frontend bundle because the Android and Windows apps embed it.
      # This does NOT publish a website or create a web-release artifact.
      - name: Build embedded app assets
        run: bun run build

      - name: Verify app assets
        run: |
          set -euo pipefail
          test -s dist/index.html || {
            echo "::error::Không tìm thấy dist/index.html sau khi build ứng dụng."
            exit 1
          }
          echo "App assets are ready for Android and Windows packaging."

      - name: Upload app assets for packaging only
        uses: actions/upload-artifact@v4
        with:
          name: app-assets
          path: dist/
          retention-days: 1
          if-no-files-found: error

  android:
    name: Android APK
    needs: prepare-app
    if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'Windows-v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-app.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Download app assets
        uses: actions/download-artifact@v4
        with:
          name: app-assets
          path: dist

      - name: Generate Capacitor Android project
        run: |
          set -euo pipefail
          mkdir android-shell
          cp -r dist android-shell/dist
          cd android-shell
          npm init -y > /dev/null
          npm install "@capacitor/core@${CAPACITOR_VERSION}" "@capacitor/cli@${CAPACITOR_VERSION}" "@capacitor/android@${CAPACITOR_VERSION}"
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build exactly one APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="$GITHUB_WORKSPACE/out/${APP_SLUG}-${VERSION}-Android"
          cd android-shell/android
          chmod +x gradlew

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
              echo "::error::Keystore đã được khai báo nhưng thiếu ANDROID_KEYSTORE_PASSWORD hoặc ANDROID_KEY_ALIAS."
              exit 1
            fi

            ./gradlew assembleRelease --no-daemon --stacktrace

            BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            if [ -z "$BT" ] || [ ! -x "$BT/zipalign" ] || [ ! -x "$BT/apksigner" ]; then
              echo "::error::Không tìm thấy Android Build Tools (zipalign/apksigner)."
              exit 1
            fi

            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            trap 'rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"' EXIT

            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$OUT.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$OUT.apk"
          else
            echo "::warning::Không có ANDROID_KEYSTORE_BASE64 -> build APK debug (chữ ký debug thay đổi mỗi lần build)."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT-debug.apk"
          fi

          APK_COUNT=$(find "$GITHUB_WORKSPACE/out" -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "::error::Yêu cầu đúng 1 APK, nhưng tìm thấy $APK_COUNT file."
            find "$GITHUB_WORKSPACE/out" -maxdepth 1 -type f -print
            exit 1
          fi
          ls -lah "$GITHUB_WORKSPACE/out"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows (2 EXE)
    needs: prepare-app
    if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'Android-v')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare-app.outputs.version }}
      OWNER: ${{ github.repository_owner }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download app assets
        uses: actions/download-artifact@v4
        with:
          name: app-assets
          path: dist

      - name: Create Electron shell
        run: |
          set -euo pipefail
          mkdir shell
          cp -r dist shell/dist
          cd shell

          cat > server.cjs <<'EOF'
          'use strict';
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const MIME = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.mjs': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.wasm': 'application/wasm',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.webp': 'image/webp',
            '.ico': 'image/x-icon',
            '.woff': 'font/woff',
            '.woff2': 'font/woff2',
            '.mp3': 'audio/mpeg',
            '.ogg': 'audio/ogg',
            '.wav': 'audio/wav',
            '.txt': 'text/plain; charset=utf-8',
          };

          function startServer(root, preferredPort) {
            const base = path.resolve(root);
            const server = http.createServer(function (req, res) {
              var pathname;
              try {
                pathname = decodeURIComponent(new URL(req.url, 'http://127.0.0.1').pathname);
              } catch (e) {
                res.writeHead(400);
                res.end();
                return;
              }
              var file = path.resolve(path.join(base, pathname));
              if (file !== base && !file.startsWith(base + path.sep)) {
                res.writeHead(403);
                res.end();
                return;
              }
              var send = function (target) {
                var type = MIME[path.extname(target).toLowerCase()] || 'application/octet-stream';
                res.writeHead(200, { 'Content-Type': type, 'Cache-Control': 'no-cache' });
                fs.createReadStream(target).pipe(res);
              };
              fs.stat(file, function (err, st) {
                if (!err && st.isDirectory()) {
                  file = path.join(file, 'index.html');
                  err = fs.existsSync(file) ? null : new Error('missing');
                  st = { isFile: function () { return !err; } };
                }
                if (!err && st.isFile()) {
                  send(file);
                } else if (!path.extname(pathname)) {
                  send(path.join(base, 'index.html'));
                } else {
                  res.writeHead(404);
                  res.end();
                }
              });
            });
            return new Promise(function (resolve, reject) {
              var attempt = function (port) {
                server.once('error', function (err) {
                  if (err.code === 'EADDRINUSE' && port !== 0) attempt(0);
                  else reject(err);
                });
                server.listen(port, '127.0.0.1', function () {
                  resolve(server.address().port);
                });
              };
              attempt(preferredPort);
            });
          }

          module.exports = { startServer: startServer };
          EOF

          cat > main.cjs <<'EOF'
          'use strict';
          const { app, BrowserWindow, shell } = require('electron');
          const path = require('path');
          const { startServer } = require('./server.cjs');

          const PORT = 38417;
          app.commandLine.appendSwitch('autoplay-policy', 'no-user-gesture-required');

          if (!app.requestSingleInstanceLock()) {
            app.quit();
          } else {
            let win = null;
            app.on('second-instance', function () {
              if (win) {
                if (win.isMinimized()) win.restore();
                win.focus();
              }
            });
            app.whenReady().then(async function () {
              const port = await startServer(path.join(__dirname, 'dist'), PORT);
              const origin = 'http://127.0.0.1:' + port;
              win = new BrowserWindow({
                width: 1280,
                height: 820,
                minWidth: 900,
                minHeight: 600,
                backgroundColor: '#181817',
                autoHideMenuBar: true,
                title: 'Crownline Chess',
                webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true },
              });
              win.setMenuBarVisibility(false);
              win.webContents.setWindowOpenHandler(function (details) {
                if (/^https?:/i.test(details.url) && !details.url.startsWith(origin)) {
                  shell.openExternal(details.url);
                }
                return { action: 'deny' };
              });
              win.loadURL(origin + '/');
            });
            app.on('window-all-closed', function () { app.quit(); });
          }
          EOF

          node -e '
            const pkg = {
              name: process.env.APP_SLUG.toLowerCase(),
              productName: process.env.APP_NAME,
              version: process.env.VERSION,
              description: process.env.APP_NAME,
              author: process.env.OWNER,
              main: "main.cjs",
              build: {
                appId: process.env.APP_ID,
                productName: process.env.APP_NAME,
                directories: { output: "release" },
                files: ["main.cjs", "server.cjs", "dist/**/*"],
                win: { target: [{ target: "nsis", arch: ["x64"] }, { target: "portable", arch: ["x64"] }] },
                nsis: {
                  oneClick: false,
                  allowToChangeInstallationDirectory: true,
                  artifactName: process.env.APP_SLUG + "-${version}-Windows-x64-Setup.${ext}"
                },
                portable: { artifactName: process.env.APP_SLUG + "-${version}-Windows-x64-Portable.${ext}" }
              }
            };
            require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Install Electron + electron-builder
        working-directory: shell
        run: npm install --save-dev "electron@${ELECTRON_VERSION}" "electron-builder@${ELECTRON_BUILDER_VERSION}"

      - name: Build installer + portable
        working-directory: shell
        run: npx electron-builder --win --x64 --publish never

      - name: Collect exactly two EXE files
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t EXES < <(find shell/release -maxdepth 1 -type f -name '*.exe' -print | sort)
          if [ "${#EXES[@]}" -ne 2 ]; then
            echo "::error::Yêu cầu đúng 2 EXE (Setup + Portable), nhưng tìm thấy ${#EXES[@]} file."
            find shell/release -maxdepth 1 -type f -print || true
            exit 1
          fi

          SETUP="shell/release/${APP_SLUG}-${VERSION}-Windows-x64-Setup.exe"
          PORTABLE="shell/release/${APP_SLUG}-${VERSION}-Windows-x64-Portable.exe"
          test -f "$SETUP" || { echo "::error::Thiếu file Setup: $SETUP"; exit 1; }
          test -f "$PORTABLE" || { echo "::error::Thiếu file Portable: $PORTABLE"; exit 1; }

          cp "$SETUP" "$PORTABLE" out/
          test "$(find out -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 2
          ls -lah out

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare-app, android, windows]
    if: ${{ !cancelled() && github.ref_type == 'tag' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare-app.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create or update release
        run: |
          set -euo pipefail
          ls -lah release
          APK_COUNT=$(find release -maxdepth 1 -type f -name '*.apk' | wc -l)
          EXE_COUNT=$(find release -maxdepth 1 -type f -name '*.exe' | wc -l)
          case "$TAG" in
            Android-v*)
              EXPECTED_APK=1
              EXPECTED_EXE=0
              ;;
            Windows-v*)
              EXPECTED_APK=0
              EXPECTED_EXE=2
              ;;
            v*)
              EXPECTED_APK=1
              EXPECTED_EXE=2
              ;;
            *)
              echo "::error::Tag không được hỗ trợ: $TAG"
              exit 1
              ;;
          esac

          if [ "$APK_COUNT" -ne "$EXPECTED_APK" ] || [ "$EXE_COUNT" -ne "$EXPECTED_EXE" ]; then
            echo "::error::Sai số lượng file. Mong đợi APK=$EXPECTED_APK, EXE=$EXPECTED_EXE; thực tế APK=$APK_COUNT, EXE=$EXE_COUNT."
            exit 1
          fi

          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$TAG" --generate-notes $FLAGS
          fi
